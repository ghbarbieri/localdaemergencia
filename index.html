<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="description" content="Localização de emergência. Rua, número, direção, velocidade, referências, coordenadas e Plus Code." />
  <meta name="theme-color" content="#0b1020" />
  <meta name="color-scheme" content="dark light" />
  <title>Emergência • Localização</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='24' fill='%230ea5e9'/%3E%3Cpath d='M64 28a36 36 0 1036 36A36 36 0 0064 28Zm0 12a24 24 0 11-24 24A24 24 0 0164 40Z' fill='white'/%3E%3Ccircle cx='64' cy='64' r='6' fill='%230ea5e9'/%3E%3C/svg%3E" />

  <script src="https://cdn.jsdelivr.net/npm/open-location-code@2.0.0/openlocationcode.min.js"></script>

  <style>
    :root {
      --bg:#0b1020; --fg:#e5f2ff; --primary:#0ea5e9; --muted:#8aa4b8;
      --card:#0f172a; --radius:14px; --shadow:0 8px 30px rgba(2,6,23,.18);
      --ok:#10b981; --warn:#f59e0b; --err:#ef4444;
      --addr-size: clamp(2.2rem, 10.5vw, 4.5rem);
      --speed-size: clamp(1.2rem, 5vw, 1.9rem);
      --city-size: clamp(0.9rem, 3.8vw, 1.2rem);
    }
    body.light-theme {
      --bg:#f0f4f8; --fg:#0f172a; --primary:#0284c7; --muted:#475569;
      --card:#fff; --shadow:0 8px 30px rgba(51,65,85,.1);
    }
    *{box-sizing:border-box} html,body{height:100%;margin:0}
    body{
      font:400 16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica Neue,Arial;
      color:var(--fg); background:var(--bg); transition:background-color .3s,color .3s;
      -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
    }
    main{
      display:flex; flex-direction:column; padding:12px 12px 28px;
      gap:12px; min-height:100vh; padding-top:44px;
    }
    #status-bar{
      padding:8px 12px; font-size:13px; font-weight:700; color:#fff;
      text-shadow:0 1px 2px rgba(0,0,0,.25); transition:background-color .3s;
      position:fixed; top:0; left:0; right:0; z-index:100; text-align:center;
    }
    .status-ok{background:var(--ok)} .status-warn{background:var(--warn)} .status-err{background:var(--err)}

    .card{
      background:var(--card); border-radius:var(--radius); padding:14px 16px;
      text-align:center; box-shadow:var(--shadow);
    }
    .primary-info h1{
      margin:0; font-size:var(--addr-size); line-height:1.08; font-weight:900;
      color:var(--primary); letter-spacing:-.5px; word-break:break-word;
    }
    .primary-info h1 .house-num{
      display:block; font-size:.55em; color:var(--fg); font-weight:700;
      margin-top:4px; opacity:.85;
    }
    .primary-info .sub-heading{
      font-size:var(--speed-size); line-height:1.15; font-weight:800;
      color:var(--fg); margin-top:.5rem;
    }
    .primary-info .context{
      font-size:var(--city-size); color:var(--muted); margin-top:.3rem; font-weight:600;
    }
    .loading-text{opacity:.5; font-style:italic}

    .poi-card h2{margin:0 0 10px 0; font-size:1rem; font-weight:700}
    .poi-list{display:grid; gap:8px; text-align:left}
    .poi-item{border-left:3px solid var(--primary); padding:8px 10px; background:color-mix(in srgb, var(--primary) 6%, transparent); border-radius:8px}
    .poi-item .name{font-weight:700; font-size:.95rem}
    .poi-item .meta{font-size:.82rem; color:var(--muted); margin-top:2px}
    .poi-item .meta.err{color:var(--err)}

    .secondary-info .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; text-align:left}
    .secondary-info .data-point{background:color-mix(in srgb, var(--muted) 8%, transparent); padding:8px 10px; border-radius:8px}
    .secondary-info .data-point .label{font-size:.7rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.5px}
    .secondary-info .data-point .value{font-weight:700; font-size:.92rem; margin-top:2px; word-break:break-all}

    .actions{margin-top:12px; display:grid; gap:8px}
    .dial-actions{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
    .actions .label{font-size:.72rem; color:var(--muted); font-weight:600; margin-bottom:4px; text-align:left; text-transform:uppercase; letter-spacing:.5px}

    button,.btn{
      display:block; width:100%; text-decoration:none; appearance:none; cursor:pointer;
      font-weight:600; font-family:inherit; font-size:.95rem;
      background:linear-gradient(180deg, color-mix(in oklab, var(--primary), #fff 10%), var(--primary));
      color:#fff; border:0; border-radius:12px; padding:12px 16px; box-shadow:var(--shadow);
      transition:transform .1s,opacity .15s;
    }
    .btn-dial{background:var(--primary); font-size:.88rem; padding:11px 6px; text-align:center}
    .btn-cpr{background:var(--warn); color:#0b1020}
    .btn-sms{background:#3b82f6}
    .btn-alt{background:#334155; font-size:.85rem; padding:10px}
    .btn-theme{background:transparent; border:1px solid var(--muted); color:var(--fg); font-size:.8rem; padding:6px}
    button:active,.btn:active{transform:translateY(1px) scale(.98); opacity:.85}

    [hidden]{display:none!important}
    .theme-toggle{
      position:fixed; top:50px; right:10px; z-index:110; width:40px; height:40px;
      border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px;
    }

    .modal-overlay{
      position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:200;
      display:flex; align-items:center; justify-content:center; padding:16px;
    }
    .modal-content{
      background:var(--card); padding:20px; border-radius:var(--radius);
      max-width:400px; width:100%; text-align:left;
    }
    .modal-content h2{margin:0 0 14px 0; font-size:1.2rem}
    .modal-content .form-group{display:grid; gap:8px}
    .modal-content input{
      width:100%; padding:12px; border-radius:8px; border:1px solid var(--muted);
      background:var(--bg); color:var(--fg); font-size:1.1rem;
    }
    .modal-content .modal-actions{display:flex; gap:10px; margin-top:16px; justify-content:flex-end}
    .coords-full{grid-column:1/-1}

    /* Spinner para quando está buscando */
    .spinner{display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; vertical-align:middle; margin-right:6px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .coord-fallback{
      background:color-mix(in srgb, var(--warn) 15%, transparent);
      border:1px solid var(--warn); border-radius:8px; padding:6px 10px;
      font-size:.85rem; margin-bottom:8px; text-align:left; color:var(--fg);
    }
    .coord-fallback .cf-label{font-size:.7rem; color:var(--muted); font-weight:600}
  </style>
</head>
<body>
  <div id="status-bar" class="status-warn">
    <span class="spinner"></span> Buscando GPS...
  </div>
  <button id="themeToggleBtn" class="theme-toggle btn btn-theme" aria-label="Alternar tema">🌙</button>

  <main>
    <!-- Fallback de coordenadas visível imediatamente -->
    <div id="coordFallback" class="coord-fallback" hidden>
      <div class="cf-label">COORDENADAS ATUAIS</div>
      <div id="coordFallbackValue" style="font-weight:700;font-size:1rem">--</div>
    </div>

    <div class="card primary-info">
      <h1 id="address">--</h1>
      <div id="direction-speed" class="sub-heading">-- km/h</div>
      <div id="city-info" class="context">--</div>
    </div>

    <div class="card poi-card">
      <h2>Pontos de Referência</h2>
      <div id="pois" class="poi-list">
        <div class="poi-item"><div class="meta loading-text">Aguardando localização...</div></div>
      </div>
    </div>

    <div class="card secondary-info">
      <div class="grid">
        <div class="data-point coords-full">
          <div class="label">PLUS CODE</div>
          <div id="pluscode" class="value" style="font-size:1.15rem;letter-spacing:1px">--</div>
        </div>
        <div class="data-point">
          <div class="label">LAT / LON</div>
          <div id="coords" class="value">--</div>
        </div>
        <div class="data-point">
          <div class="label">PRECISÃO</div>
          <div id="accuracy" class="value">-- m</div>
        </div>
      </div>
      <div class="actions">
        <div>
          <div class="label">Ligar Emergência</div>
          <div class="dial-actions">
            <a href="tel:190" class="btn btn-dial">🚔 190</a>
            <a href="tel:192" class="btn btn-dial">🚑 192</a>
            <a href="tel:193" class="btn btn-dial">🚒 193</a>
          </div>
        </div>
        <button id="smsAlertBtn" class="btn-sms" hidden>📱 Enviar SMS de Emergência</button>
        <button id="shareAll">📤 Compartilhar Localização</button>
        <button id="cprBeepBtn" class="btn-cpr">💓 Beep RCP (110 bpm)</button>
        <button id="configBtn" class="btn-alt">⚙️ Configurar Contato SMS</button>
      </div>
    </div>
  </main>

  <div id="contactModal" class="modal-overlay" hidden>
    <div class="modal-content">
      <h2>Contato de Emergência</h2>
      <div class="form-group">
        <label for="contactNumber">Telefone com DDD</label>
        <input type="tel" id="contactNumber" inputmode="numeric" placeholder="11987654321" maxlength="15">
        <small style="color:var(--muted);font-size:.78rem">Salvo apenas neste aparelho.</small>
      </div>
      <div class="modal-actions">
        <button id="cancelContact" class="btn-alt">Cancelar</button>
        <button id="saveContact">Salvar</button>
      </div>
    </div>
  </div>

<script type="module">
  // ===== UTILS =====
  const $ = (sel) => document.querySelector(sel);

  function calcBearing(lat1, lon1, lat2, lon2) {
    const toRad = (d) => d * Math.PI / 180;
    const toDeg = (r) => r * 180 / Math.PI;
    const dLon = toRad(lon2 - lon1);
    const y = Math.sin(dLon) * Math.cos(toRad(lat2));
    const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }

  const DIRECTIONS = ['Norte','Nordeste','Leste','Sudeste','Sul','Sudoeste','Oeste','Noroeste'];
  function dirFromBearing(b) { return DIRECTIONS[Math.round(b / 45) % 8]; }

  function haversineM(lat1, lon1, lat2, lon2) {
    const R = 6371e3, toRad = (d) => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  // ===== STATE =====
  let currentPosition = null;
  let lastApiCoords = { lat: null, lon: null };
  let lastPoiCoords = { lat: null, lon: null };
  let isOnline = navigator.onLine;
  let hasFirstFix = false;
  let watchId = null;
  let themeIsDark = true;
  let cprTimer = null;
  let audioCtx = null;

  const UI_REFRESH_MS = 1000;
  const ADDRESS_REFRESH_MS = 12000;
  const POI_REFRESH_MS = 25000;
  const MIN_MOVE_ADDRESS_M = 20;
  const MIN_MOVE_POI_M = 50;
  const POI_RADIUS_M = 350;
  const EMERGENCY_CONTACT_KEY = 'emerg:contact';
  const THEME_KEY = 'emerg:theme';

  // ===== INIT =====
  window.addEventListener('load', () => {
    // Theme
    const savedTheme = localStorage.getItem(THEME_KEY);
    if (savedTheme === 'light') setLightTheme(); else setDarkTheme();

    setupOnlineDetection();
    loadEmergencyContact();
    setupActionListeners();

    if (!('geolocation' in navigator)) {
      updateStatusBar('GPS não disponível neste dispositivo', 'err');
      return;
    }

    // ESTRATÉGIA EM DUAS CAMADAS:
    // 1) getCurrentPosition rápido (baixa precisão) para dar feedback imediato
    // 2) watchPosition (alta precisão) para atualizações contínuas

    // Camada 1: tentativa rápida
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        // Primeira posição obtida rapidamente
        applyPosition(pos, false);
      },
      () => {
        // Falhou rápido, mas o watchPosition vai tentar
        console.log('Quick fix failed, waiting for watchPosition...');
      },
      { enableHighAccuracy: false, maximumAge: 30000, timeout: 8000 }
    );

    // Camada 2: watch contínuo com alta precisão
    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        applyPosition(pos, true);
      },
      (err) => {
        const msgs = {
          1: 'Permissão GPS negada. Vá em Configurações e ative para este site.',
          2: 'Posição indisponível. Verifique se o GPS está ligado.',
          3: 'Tempo esgotado. Tente ao ar livre.'
        };
        updateStatusBar(msgs[err.code] || `Erro GPS: ${err.message}`, 'err');
      },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
    );

    // Atualização periódica da UI com dados em cache
    setInterval(updateUI, UI_REFRESH_MS);
    setInterval(maybeRefreshAddress, ADDRESS_REFRESH_MS);
    setInterval(maybeRefreshPOIs, POI_REFRESH_MS);
  });

  function applyPosition(pos, fromWatch) {
    currentPosition = pos;
    const { latitude, longitude, accuracy } = pos.coords;

    if (!hasFirstFix) {
      hasFirstFix = true;
      // Mostrar coordenadas imediatamente no fallback
      showCoordFallback(latitude, longitude);
    }

    // Atualizar UI imediatamente
    updateUI();

    // Se for do watchPosition (alta precisão) e nunca fez geocode, faz agora
    if (fromWatch) {
      if (lastApiCoords.lat === null) fetchAddress();
      if (lastPoiCoords.lat === null) fetchPOIs();
    }
  }

  function showCoordFallback(lat, lon) {
    const el = $('#coordFallback');
    $('#coordFallbackValue').textContent = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
    el.hidden = false;
  }

  // ===== UI UPDATE (rápido, sem rede) =====
  function updateUI() {
    if (!currentPosition) return;

    const { latitude, longitude, accuracy, heading, speed } = currentPosition.coords;
    const acc = Math.round(accuracy);

    // Status bar
    if (isOnline) {
      if (!hasFirstFix) {
        updateStatusBar('<span class="spinner"></span> Buscando GPS...', 'warn');
      } else if (acc > 100) {
        updateStatusBar(`GPS buscando precisão... (±${acc}m)`, 'warn');
      } else if (acc <= 20) {
        updateStatusBar(`GPS preciso • ±${acc}m`, 'ok');
      } else {
        updateStatusBar(`GPS bom • ±${acc}m`, 'ok');
      }
    } else {
      updateStatusBar('⚠️ Offline — apenas GPS local', 'warn');
    }

    // Direção e velocidade
    const headingDeg = Number.isFinite(heading) ? heading : null;
    const dirText = headingDeg !== null ? `Sentido ${dirFromBearing(headingDeg)}` : 'Sem direção';
    const speedKmh = speed ? Math.round(speed * 3.6) : 0;
    const speedText = speedKmh > 0 ? `${dirText} • ${speedKmh} km/h` : dirText;
    $('#direction-speed').textContent = speedText;

    // Coordenadas
    $('#coords').textContent = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
    $('#accuracy').textContent = `${acc} m`;

    // Atualizar fallback se visível
    if (!$('#coordFallback').hidden) {
      $('#coordFallbackValue').textContent = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
    }

    // Plus Code
    updatePlusCode(latitude, longitude);
  }

  function updatePlusCode(lat, lon) {
    const el = $('#pluscode');
    try {
      // A biblioteca expõe como "openlocationcode" (minúsculo) no escopo global
      const lib = window.openlocationcode;
      if (lib && typeof lib.encode === 'function') {
        el.textContent = lib.encode(lat, lon);
        return;
      }
      // Fallback: Plus Code curto aproximado
      const pcShort = encodePlusCodeShort(lat, lon);
      el.textContent = pcShort;
    } catch (e) {
      el.textContent = `${lat.toFixed(4)}+${String(Math.round(((lon % 1) + 1) % 1 * 100)).padStart(2, '0')}`;
    }
  }

  // Plus Code simplificado como fallback (8 dígitos)
  function encodePlusCodeShort(lat, lon) {
    const codeDigits = '23456789CFGHJKLMMPQRVWX';
    const gridCols = 20, gridRows = 20;
    const latOffset = 90, lonOffset = 180;
    let result = '';

    // Parte inteira
    const latDeg = Math.floor(lat + latOffset);
    const lonDeg = Math.floor(lon + lonOffset);
    result += codeDigits[Math.min(Math.floor(latDeg / 20), 19)];
    result += codeDigits[Math.min(Math.floor(lonDeg / 20), 19)];
    result += codeDigits[Math.min(Math.floor(latDeg / 4) % 5, 19)];
    result += codeDigits[Math.min(Math.floor(lonDeg / 4) % 5, 19)];

    // Parte fracionária (simplificada - 4 dígitos)
    let latFrac = (lat + latOffset - latDeg) * 20;
    let lonFrac = (lon + lonOffset - lonDeg) * 20;
    for (let i = 0; i < 4; i++) {
      result += codeDigits[Math.floor(latFrac) % gridRows];
      result += codeDigits[Math.floor(lonFrac) % gridCols];
      if (i === 1) result += '+';
      latFrac = (latFrac - Math.floor(latFrac)) * gridRows;
      lonFrac = (lonFrac - Math.floor(lonFrac)) * gridCols;
    }

    return result;
  }

  // ===== THROTTLED API CALLS =====
  function maybeRefreshAddress() {
    if (!currentPosition || !isOnline || !hasFirstFix) return;
    const { latitude, longitude } = currentPosition.coords;
    if (lastApiCoords.lat !== null) {
      const dist = haversineM(lastApiCoords.lat, lastApiCoords.lon, latitude, longitude);
      if (dist < MIN_MOVE_ADDRESS_M) return;
    }
    fetchAddress();
  }

  function maybeRefreshPOIs() {
    if (!currentPosition || !isOnline || !hasFirstFix) return;
    const { latitude, longitude } = currentPosition.coords;
    if (lastPoiCoords.lat !== null) {
      const dist = haversineM(lastPoiCoords.lat, lastPoiCoords.lon, latitude, longitude);
      if (dist < MIN_MOVE_POI_M) return;
    }
    fetchPOIs();
  }

  // ===== GEOCODING (otimizado para Brasil, baixa banda) =====
  async function fetchAddress() {
    if (!currentPosition) return;
    const { latitude, longitude } = currentPosition.coords;
    lastApiCoords = { lat: latitude, lon: longitude };

    const addrEl = $('#address');
    const cityEl = $('#city-info');
    addrEl.classList.add('loading-text');

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 7000);

    try {
      const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&accept-language=pt-BR&zoom=18&addressdetails=1`;
      const res = await fetch(url, {
        signal: controller.signal,
        headers: { 'User-Agent': 'EmergenciaBRApp/1.0' }
      });
      clearTimeout(timeoutId);

      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const a = data.address || {};

      let roadName = '';
      let houseNumber = '';

      const rawRoad = a.road || a.pedestrian || a.footway || a.highway || a.path || '';
      if (rawRoad) {
        roadName = rawRoad
          .replace(/^Rua /, 'R. ')
          .replace(/^Avenida /, 'Av. ')
          .replace(/^Travessa /, 'Trav. ')
          .replace(/^Estrada /, 'Estr. ')
          .replace(/^Rodovia /, 'Rod. ')
          .replace(/^Alameda /, 'Al. ')
          .replace(/^Praça /, 'Pç. ')
          .replace(/^Largo /, 'Lg. ');
      }

      houseNumber = a.house_number || '';

      if (roadName) {
        let html = roadName;
        if (houseNumber) {
          html += `<span class="house-num">Nº ${houseNumber}</span>`;
        }
        addrEl.innerHTML = html;
      } else {
        const fallback = a.neighbourhood || a.suburb || a.quarter || a.city || 'Local sem endereço';
        addrEl.textContent = fallback;
      }

      const parts = [a.suburb, a.neighbourhood, a.city || a.town || a.village, a.state].filter(Boolean);
      cityEl.textContent = parts.join(', ');

    } catch (e) {
      console.warn('Geocode error:', e);
      addrEl.textContent = e.name === 'AbortError' ? 'Tempo esgotado' : 'Endereço indisponível';
      addrEl.innerHTML = '';
      addrEl.textContent = e.name === 'AbortError' ? 'Tempo esgotado' : 'Endereço indisponível';
    } finally {
      addrEl.classList.remove('loading-text');
    }
  }

  // ===== POIs (consulta otimizada, menos dados) =====
  async function fetchPOIs() {
    if (!currentPosition) return;
    const { latitude, longitude } = currentPosition.coords;
    lastPoiCoords = { lat: latitude, lon: longitude };

    const poisEl = $('#pois');
    poisEl.innerHTML = '<div class="poi-item"><div class="meta loading-text">Buscando referências...</div></div>';

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 8000);

    try {
      const q = `[out:json][timeout:8];
        (
          node["amenity"~"hospital|clinic|fire_station|police|pharmacy|fuel"](around:${POI_RADIUS_M},${latitude},${longitude});
          node["shop"~"supermarket|convenience"](around:${POI_RADIUS_M},${latitude},${longitude});
          node["highway"~"bus_stop"](around:${POI_RADIUS_M},${latitude},${longitude});
        );
        out center 15;`;

      const res = await fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        body: `data=${encodeURIComponent(q)}`,
        signal: controller.signal,
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
      });
      clearTimeout(timeoutId);

      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();

      const poiLabels = {
        hospital: '🏥 Hospital', clinic: '🏥 Clínica', fire_station: '🚒 Bombeiros',
        police: '🚔 Delegacia', pharmacy: '💊 Farmácia', fuel: '⛽ Posto',
        supermarket: '🛒 Supermercado', convenience: '🏪 Conveniência',
        bus_stop: '🚌 Ponto de Ônibus'
      };

      const items = (json.elements || [])
        .map((e) => {
          const clat = e.lat || (e.center && e.center.lat);
          const clon = e.lon || (e.center && e.center.lon);
          if (!clat || !clon) return null;
          const tagKey = e.tags?.amenity || e.tags?.shop || e.tags?.highway;
          return {
            label: poiLabels[tagKey] || '📍 Referência',
            name: e.tags?.name || e.tags?.brand || 'Sem nome',
            dist: Math.round(haversineM(latitude, longitude, clat, clon)),
            dir: dirFromBearing(calcBearing(latitude, longitude, clat, clon)),
            road: e.tags?.['addr:street'] || null,
            number: e.tags?.['addr:housenumber'] || null
          };
        })
        .filter(Boolean)
        .sort((a, b) => a.dist - b.dist)
        .slice(0, 5);

      if (items.length === 0) {
        poisEl.innerHTML = '<div class="poi-item"><div class="meta">Nenhum ponto encontrado num raio de ' + POI_RADIUS_M + 'm.</div></div>';
        return;
      }

      poisEl.innerHTML = '';
      items.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'poi-item';
        let metaHtml = `${item.dist}m • ${item.dir}`;
        if (item.road) metaHtml += ` • ${item.road}`;
        if (item.number) metaHtml += `, ${item.number}`;
        div.innerHTML = `<div class="name">${item.label}: ${item.name}</div><div class="meta">${metaHtml}</div>`;
        poisEl.appendChild(div);
      });

    } catch (e) {
      console.warn('POI error:', e);
      const msg = e.name === 'AbortError' ? 'Busca demorou demais.' : 'Não foi possível carregar referências.';
      poisEl.innerHTML = `<div class="poi-item"><div class="meta err">${msg}</div></div>`;
    }
  }

  // ===== STATUS BAR =====
  function updateStatusBar(html, status) {
    const bar = $('#status-bar');
    bar.innerHTML = html;
    bar.className = `status-${status}`;
  }

  // ===== THEME =====
  function setDarkTheme() {
    document.body.classList.remove('light-theme');
    themeIsDark = true;
    $('#themeToggleBtn').textContent = '🌙';
    localStorage.setItem(THEME_KEY, 'dark');
  }
  function setLightTheme() {
    document.body.classList.add('light-theme');
    themeIsDark = false;
    $('#themeToggleBtn').textContent = '☀️';
    localStorage.setItem(THEME_KEY, 'light');
  }

  // ===== ONLINE DETECTION =====
  function setupOnlineDetection() {
    const update = () => {
      isOnline = navigator.onLine;
      if (!isOnline && hasFirstFix) updateStatusBar('⚠️ Offline — apenas GPS local', 'warn');
    };
    window.addEventListener('online', update);
    window.addEventListener('offline', update);
  }

  // ===== ACTION HANDLERS =====
  function setupActionListeners() {
    $('#themeToggleBtn')?.addEventListener('click', () => themeIsDark ? setLightTheme() : setDarkTheme());
    $('#shareAll')?.addEventListener('click', handleShare);
    $('#smsAlertBtn')?.addEventListener('click', handleSmsAlert);
    $('#cprBeepBtn')?.addEventListener('click', handleCprBeep);
    $('#configBtn')?.addEventListener('click', () => { $('#contactModal').hidden = false; $('#contactNumber').focus(); });
    $('#cancelContact')?.addEventListener('click', () => { $('#contactModal').hidden = true; });
    $('#saveContact')?.addEventListener('click', handleSaveContact);
    $('#contactNumber')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSaveContact(); });
  }

  function loadEmergencyContact() {
    const contact = localStorage.getItem(EMERGENCY_CONTACT_KEY);
    const smsBtn = $('#smsAlertBtn');
    if (contact) { smsBtn.hidden = false; $('#contactNumber').value = contact; }
    else { smsBtn.hidden = true; }
  }

  function handleSaveContact() {
    const input = $('#contactNumber');
    const num = input.value.replace(/\D/g, '');
    if (num.length >= 10 && num.length <= 11) {
      localStorage.setItem(EMERGENCY_CONTACT_KEY, num);
      $('#contactModal').hidden = true;
      loadEmergencyContact();
    } else {
      alert('Número inválido. Use DDD + número (ex: 11987654321).');
    }
  }

  function buildAlertPayload() {
    if (!currentPosition) return 'Localização indisponível.';
    const { latitude, longitude } = currentPosition.coords;
    const addrText = $('#address').textContent || 'Endereço desconhecido';
    const cityText = $('#city-info').textContent || '';
    const dirSpeed = $('#direction-speed').textContent;
    const plusCode = $('#pluscode').textContent;
    return `🚨 EMERGÊNCIA\n\n📍 ${addrText}${cityText ? ' - ' + cityText : ''}\n🧭 ${dirSpeed}\n📌 ${latitude.toFixed(5)}, ${longitude.toFixed(5)}\n🔖 Plus Code: ${plusCode}\n🗺️ Maps: https://maps.google.com/?q=${latitude},${longitude}`;
  }

  async function handleShare() {
    const payload = buildAlertPayload();
    if (navigator.share) {
      try { await navigator.share({ title: 'Localização de Emergência', text: payload }); }
      catch (err) { console.warn('Share failed:', err); fallbackCopy(payload); }
    } else {
      fallbackCopy(payload);
    }
  }

  function fallbackCopy(text) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => {
        if (confirm('Copiado! Abrir WhatsApp para enviar?')) {
          window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
        }
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        alert('Copiado! Cole onde precisar.');
      });
    } else {
      alert(text);
    }
  }

  function handleSmsAlert() {
    const contact = localStorage.getItem(EMERGENCY_CONTACT_KEY);
    if (!contact) { alert('Configure um contato primeiro.'); return; }
    if (!currentPosition) { alert('Localização indisponível.'); return; }
    const payload = buildAlertPayload();
    const ua = navigator.userAgent || '';
    const isIOS = /iPad|iPhone|iPod/.test(ua);
    const sep = isIOS ? '&body=' : '?body=';
    window.location.href = `sms:${contact}${sep}${encodeURIComponent(payload)}`;
  }

  // ===== CPR BEEP =====
  async function handleCprBeep() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    if (cprTimer) {
      clearInterval(cprTimer);
      cprTimer = null;
      $('#cprBeepBtn').textContent = '💓 Beep RCP (110 bpm)';
      return;
    }

    const beep = () => {
      if (audioCtx.state === 'closed') return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.value = 880;
      const now = audioCtx.currentTime;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.8, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.15);
    };

    beep();
    cprTimer = setInterval(beep, 60000 / 110);
    $('#cprBeepBtn').textContent = '⏹ Parar Beep';
  }
</script>
</body>
